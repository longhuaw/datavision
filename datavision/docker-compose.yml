services:
  # ==================== MySQL 数据库 ====================
  mysql:
    image: mysql:8.0
    container_name: datavision-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: datavision
      MYSQL_USER: datavision
      MYSQL_PASSWORD: datavision123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --max_connections=500
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "datavision", "-pdatavision123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dv-network

  # ==================== Redis 缓存 ====================
  redis:
    image: redis:7-alpine
    container_name: datavision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dv-network

  # ==================== FastAPI 后端 ====================
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: datavision-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: datavision
      MYSQL_PASSWORD: datavision123
      MYSQL_DATABASE: datavision
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend:3000"]'
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - logs_data:/app/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - dv-network

  # ==================== Celery Worker ====================
  celery:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: datavision-celery
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: datavision
      MYSQL_PASSWORD: datavision123
      MYSQL_DATABASE: datavision
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - dv-network

  # ==================== Celery Beat ====================
  celery-beat:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: datavision-celery-beat
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: datavision
      MYSQL_PASSWORD: datavision123
      MYSQL_DATABASE: datavision
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - dv-network

  # ==================== React 前端 (开发模式) ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: datavision-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - dv-network

  # ==================== Nginx (生产模式) ====================
  nginx:
    image: nginx:alpine
    container_name: datavision-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    profiles:
      - production
    networks:
      - dv-network

volumes:
  mysql_data:
  redis_data:
  uploads_data:
  logs_data:

networks:
  dv-network:
    driver: bridge
